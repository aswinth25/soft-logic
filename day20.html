<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    // 1. 1 to 20

for(let i = 1; i <= 20; i++)
{
    document.write(i + " ");
}

let i = 1;

while(i <= 20)
{
    document.write(i + " ");
    i++;
}

i = 1;

do
{
    document.write(i + " ");
    i++;
}
while(i <= 20);


// 2. Odd numbers 1 to 20

for(let i = 1; i <= 20; i++)
{
    if(i % 2 != 0)
    {
        document.write(i + " ");
    }
}

i = 1;

while(i <= 20)
{
    if(i % 2 != 0)
    {
        document.write(i + " ");
    }
    i++;
}

i = 1;

do
{
    if(i % 2 != 0)
    {
        document.write(i + " ");
    }
    i++;
}
while(i <= 20);


// 3. Even numbers 0 to 20

for(let i = 0; i <= 20; i++)
{
    if(i % 2 == 0)
    {
        document.write(i + " ");
    }
}

i = 0;

while(i <= 20)
{
    if(i % 2 == 0)
    {
        document.write(i + " ");
    }
    i++;
}

i = 0;

do
{
    if(i % 2 == 0)
    {
        document.write(i + " ");
    }
    i++;
}
while(i <= 20);


// 4. 0 5 10 15 20 25

for(let i = 0; i <= 25; i = i + 5)
{
    document.write(i + " ");
}

i = 0;

while(i <= 25)
{
    document.write(i + " ");
    i = i + 5;
}

i = 0;

do
{
    document.write(i + " ");
    i = i + 5;
}
while(i <= 25);


// 5. 1 + 2 + 3 + ... 20

let sum = 0;

for(let i = 1; i <= 20; i++)
{
    sum = sum + i;
}

document.write(sum);

sum = 0;
i = 1;

while(i <= 20)
{
    sum = sum + i;
    i++;
}

document.write(sum);

sum = 0;
i = 1;

do
{
    sum = sum + i;
    i++;
}
while(i <= 20);

document.write(sum);


// 6. 0 + 2 + 4 + ... 20

sum = 0;

for(let i = 0; i <= 20; i++)
{
    if(i % 2 == 0)
    {
        sum = sum + i;
    }
}

document.write(sum);

sum = 0;
i = 0;

while(i <= 20)
{
    if(i % 2 == 0)
    {
        sum = sum + i;
    }
    i++;
}

document.write(sum);

sum = 0;
i = 0;

do
{
    if(i % 2 == 0)
    {
        sum = sum + i;
    }
    i++;
}
while(i <= 20);

document.write(sum);


// 7. 1 + 3 + 5 + ... 19

sum = 0;

for(let i = 1; i <= 19; i++)
{
    if(i % 2 != 0)
    {
        sum = sum + i;
    }
}

document.write(sum);

sum = 0;
i = 1;

while(i <= 19)
{
    if(i % 2 != 0)
    {
        sum = sum + i;
    }
    i++;
}

document.write(sum);

sum = 0;
i = 1;

do
{
    if(i % 2 != 0)
    {
        sum = sum + i;
    }
    i++;
}
while(i <= 19);

document.write(sum);


// 8. 0 + 5 + 10 + 15 + 20

sum = 0;

for(let i = 0; i <= 20; i = i + 5)
{
    sum = sum + i;
}

document.write(sum);

sum = 0;
i = 0;

while(i <= 20)
{
    sum = sum + i;
    i = i + 5;
}

document.write(sum);

sum = 0;
i = 0;

do
{
    sum = sum + i;
    i = i + 5;
}
while(i <= 20);

document.write(sum);


// 9. 1/1! + 2/2! + 3/3! + 4/4!

let factorial;
let answer = 0;

for(let i = 1; i <= 4; i++)
{
    factorial = 1;

    for(let j = 1; j <= i; j++)
    {
        factorial = factorial * j;
    }

    answer = answer + (i / factorial);
}

document.write(answer);

answer = 0;
i = 1;

while(i <= 4)
{
    factorial = 1;
    let j = 1;

    while(j <= i)
    {
        factorial = factorial * j;
        j++;
    }

    answer = answer + (i / factorial);
    i++;
}

document.write(answer);

answer = 0;
i = 1;

do
{
    factorial = 1;
    let j = 1;

    do
    {
        factorial = factorial * j;
        j++;
    }
    while(j <= i);

    answer = answer + (i / factorial);
    i++;
}
while(i <= 4);

document.write(answer);


// 10. 0 + 2/2! + 4/4! + 6/6!

answer = 0;

for(let i = 0; i <= 6; i = i + 2)
{
    if(i == 0)
    {
        answer = answer + 0;
    }
    else
    {
        factorial = 1;

        for(let j = 1; j <= i; j++)
        {
            factorial = factorial * j;
        }

        answer = answer + (i / factorial);
    }
}

document.write(answer);

answer = 0;
i = 0;

while(i <= 6)
{
    if(i != 0)
    {
        factorial = 1;
        let j = 1;

        while(j <= i)
        {
            factorial = factorial * j;
            j++;
        }

        answer = answer + (i / factorial);
    }

    i = i + 2;
}

document.write(answer);

answer = 0;
i = 0;

do
{
    if(i != 0)
    {
        factorial = 1;
        let j = 1;

        do
        {
            factorial = factorial * j;
            j++;
        }
        while(j <= i);

        answer = answer + (i / factorial);
    }

    i = i + 2;
}
while(i <= 6);

document.write(answer);


// 11. 1/1! + 3/3! + 5/5! + 7/7!

answer = 0;

for(let i = 1; i <= 7; i = i + 2)
{
    factorial = 1;

    for(let j = 1; j <= i; j++)
    {
        factorial = factorial * j;
    }

    answer = answer + (i / factorial);
}

document.write(answer);

answer = 0;
i = 1;

while(i <= 7)
{
    factorial = 1;
    let j = 1;

    while(j <= i)
    {
        factorial = factorial * j;
        j++;
    }

    answer = answer + (i / factorial);
    i = i + 2;
}

document.write(answer);

answer = 0;
i = 1;

do
{
    factorial = 1;
    let j = 1;

    do
    {
        factorial = factorial * j;
        j++;
    }
    while(j <= i);

    answer = answer + (i / factorial);
    i = i + 2;
}
while(i <= 7);

document.write(answer);
</script>
