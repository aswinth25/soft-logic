<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 17 - JavaScript Assignment</title>
</head>
<body>


    <script>
        var name = "Aswinth";
        let age = 21;
        const college = "Ponjesly College of Engineering";

        document.write("Name: " + name + "<br>");
        document.write("Age: " + age + "<br>");
        document.write("College: " + college + "<br><br>");
    </script>


    

    <script>
        let studentName = "Aswinth"; 
        let mark = 85;               
        let isPassed = true;        
        let address = null;          
        let result;                 

        document.write("String: " + studentName + "<br>");
        document.write("Number: " + mark + "<br>");
        document.write("Boolean: " + isPassed + "<br>");
        document.write("Null: " + address + "<br>");
        document.write("Undefined: " + result + "<br><br>");
    </script>


    <script>
        let a = 10;
        let b = 3;

        // Arithmetic Operators
        document.write("<b>Arithmetic Operators</b><br>");
        document.write("Addition: " + (a + b) + "<br>");
        document.write("Subtraction: " + (a - b) + "<br>");
        document.write("Multiplication: " + (a * b) + "<br>");
        document.write("Division: " + (a / b) + "<br>");
        document.write("Modulus: " + (a % b) + "<br><br>");

        // Comparison Operators
        document.write("<b>Comparison Operators</b><br>");
        document.write("10 == '10': " + (10 == "10") + "<br>");
        document.write("10 === '10': " + (10 === "10") + "<br><br>");

        // Logical Operators
        document.write("<b>Logical Operators</b><br>");
        document.write("true && false: " + (true && false) + "<br>");
        document.write("true || false: " + (true || false) + "<br>");
    </script>

</body>
</html>
