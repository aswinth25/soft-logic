<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            width: 99%;
            height: 300px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cbox1{
            width: 100px;
            height: 100px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .hnav{
            width: 100%;
            height: 50px;
            background-color: aqua;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            
        }
        .hnav a{
            text-decoration: none;
            color: blue;
            font-size: 20px;
        }
        .vnav{
            width: 100px;
            height: 250px;
            background-color: aqua;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            text-align: center;
            
        }
        .vnav a{
            text-decoration: none;
            color: blue;
            font-size: 20px;
        }
        .cards {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .card {
            flex: 1;
            padding: 30px;
            text-align: center;
            background-color: lightgreen;
            border: 2px solid green;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .product-card {
            flex: 1 1 200px;
            padding: 30px;
            text-align: center;
            background-color: lightyellow;
            border: 2px solid orange;
            box-sizing: border-box;
        }


    </style>
</head>
<body>
    <div class="box1">
        <div class="cbox1">
            center box

        </div>
    </div><br><br>
    <div class="hnav">
        <a href="">Home</a>
        <a href="">Visit</a>
        <a href="">File</a>
        <a href="">Run</a>
        <a href="">About</a>

    </div><br><br>

    <div class="vnav">
        <a href="">Home</a>
        <a href="">Visit</a>
        <a href="">File</a>
        <a href="">Run</a>
        <a href="">About</a>

    </div><br><br>

    <div class="cards">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
        <div class="card">Card 4</div>
        <div class="card">Card 5</div>
    </div><br><br>

     <div class="container">
        <div class="product-card">Product 1</div>
        <div class="product-card">Product 2</div>
        <div class="product-card">Product 3</div>
        <div class="product-card">Product 4</div>
        <div class="product-card">Product 5</div>
        <div class="product-card">Product 6</div>
    </div>



</body>
</html>
