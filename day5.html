    <h1>Online Course Registration Form</h1>

    <label for="user">Student Name</label>
    <input type="text" id="user"><br><br> 
    <label for="email">email</label>
    <input type="email" id="email"><br><br>

    <label for="number"> Mobile Number</label>
    <input type="number" id="number"><br><br>
    <label for="dob">Date of Birth</label>
    <input type="date" id="dob"><br><br>
    <label >Gender</label>
    <input type="radio" id="male" >
    <label for="male">male</label>
    <input type="radio" id="Female" >
    <label for="female">female</label><br><br>
    <label for="Qualification ">Select Course  </label>
    <select name="Qualification " id="Qualification ">
        <option value="CSE">CSE</option>
        <option value="ECE">ECE</option>
        <option value="IT">IT</option>
    </select><br><br>
    <label >Learning Mode</label>
    <input type="radio" id="offline" >
    <label for="offline">offline</label>
    <input type="radio" id="online" >
    <label for="online">online</label><br><br>
    <label for="Skills">Skills</label>
    <input type="checkbox" id="Skills" value="yes"><br><br>
    <label for="Course "> Course Start Date</label>
    <input type="date" id="Course "><br><br>
    <label for="Photo"> Upload Photo</label>
    <input type="file" id="Photo"><br><br>
    <label for="Address">Address</label>
    <textarea name="Address" id="Address"></textarea><br><br>
    <label for="country">country</label>
        <select name="country" id="country">
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
        </select><br><br>
    <label for="user">Username</label>
    <input type="text" id="user">
    <label for="password">Password</label>
    <input type="password" id="password"><br><br>
    <label for="cpassword">Correct Password</label>
    <input type="cpassword" id="cpassword"><br><br>
    <label for="Agree">Agree to Terms</label>
    <input type="checkbox" id="Agree" value="yes"><br><br>
    <label for="submit">Register</label>
    <input type="submit" id="submit"><br>
    <label for="reset">clear</label>
    <input type="reset" id="reset"><br><br>
