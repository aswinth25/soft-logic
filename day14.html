<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            display: flex;
            justify-content: center;
        }
        .box2{
            display: flex;
            justify-content: center;
        }
        .div1{
            width: 100px;
            height: 100px;
            border:  2px solid black;
            padding: 10px;
            
        }
        .div1:hover{
            background-color: blue;
            color: aliceblue;
        }
        .div2{
              width: 150px;
            height: 100px;
            margin: auto;
            background-color: lightgreen;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s;
            
        }
        .div2:hover {
            transform: scale(1.3);
        }
        .div3{
              width: 100px;
            height: 100px;
            border:  2px solid black;
            padding: 10px;
            transition: transform 0.5s;
            background-color: aqua;
            
        }
        .div3:hover{
            background-color: rgb(15, 110, 86);
            color: aliceblue;

            transform: scale(1.3);
           
        }
        .div4{
              width: 100px;
            height: 100px;
            border:  2px solid black;
           
            
            background-color: rgb(160, 45, 158);
            
        }
        .divhid{
            opacity: 0;
            transition: opacity 0.8s;
        }
        .div4:hover .divhid{
            opacity: 1;
        }
        
    </style>
</head>
<body>
    <div class="box1">
        <div class="div1">
        colour change
    </div><br><br>
    
    </div><br><br>
    <div class="box2">
        <div class=div2>
        grow box
         </div>
    </div><br><br>

    <div class="box2">
        <div class="div3"> colour and grow box</div>

    </div><br><br>
    <div class="box2">
        <div class="div4">
            <div class="divhid">
                hidden message
            </div>
        </div>
    </div>
</body>
</html>
