<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .head1{
        border: 10px solid green;
        width: 300px;
        padding: 20px;
        
    }
    
        .box2 {
            width: 200px;
            border: 2px solid red;
        }

        
        .box3 {
            padding: 25px;
            border: 2px solid rgb(30, 25, 25);
        }

        
        .box4 {
            margin-left: 25px;
        }

       
        .box5 {
            width: 600px;
            padding: 20px;
            border: 2px solid black;
            margin: 0 auto;
        }

        
        .container {
            width: 600px;
            height: 100px;
            display: flex;
        }

        .container button {
            flex: 1;
            box-sizing: border-box;
        }

        
        .box6 {
            padding-top: 40px;
            padding-right: 10px;
            padding-bottom: 20px;
            padding-left: 50px;
        }
    </style>
    


<body>

   
    
    
    <h1 class="head1" >hello world</h1>
    <br>


    <div class="box2">Box 2</div>
    <br>

    <div class="box3">Box 3</div>
    <br>

    <div class="box4">Box 4</div>
    <br>

    <div class="box5">
        This div is 600px wide and centered.
    </div><br><br>

    <div class="container">
        <button>Button 1</button>
        <button>Button 2</button>
        <button>Button 3</button>
    </div>

    <div class="box6">
        Different padding on each side
    </div>
    </head>

</body>


</html>
